name: GitHub项目情报

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-email:
    runs-on: ubuntu-latest

    steps:
      - name: 测试 AgentMail 邮件
        env:
          AGENTMAIL_API_KEY: ${{ secrets.AGENTMAIL_API_KEY }}
        run: |
          echo "开始发送邮件..."

          curl -sS -X POST \
            "https://api.agentmail.to/v0/inboxes/mi-2805@agentmail.to/messages/send" \
            -H "Authorization: Bearer $AGENTMAIL_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{
              "to": ["nangongyunluo1@gmail.com"],
              "subject": "GitHub项目情报测试",
              "text": "GitHub项目情报系统邮件测试成功。"
            }' \
            -w "\nHTTP状态码: %{http_code}\n"

          echo "发送请求结束"
