name: GitHub项目情报

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  test-email:
    runs-on: ubuntu-latest

    steps:
      - name: 测试 Resend 邮件
        env:
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: |
          curl -X POST 'https://api.resend.com/emails' \
            -H "Authorization: Bearer $RESEND_API_KEY" \
            -H "Content-Type: application/json" \
            -d '{
              "from": "GitHub情报 <onboarding@resend.dev>",
              "to": ["nangongyunluo1@gmail.com"],
              "subject": "GitHub项目情报测试",
              "html": "<h2>GitHub项目情报系统测试成功</h2><p>如果你收到这封邮件，说明 GitHub Actions → Resend → Gmail 已经打通。</p>"
            }'
